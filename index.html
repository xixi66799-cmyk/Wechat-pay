<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>模拟微信支付</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#f5f5f5;margin:0;padding:0}
.wrap{max-width:420px;margin:0 auto;background:#ffffff;min-height:100vh}
.header{background:#07c160;color:white;text-align:center;padding:16px;font-size:18px}
.money-area{padding:30px 20px;text-align:center}
.money-label{color:#888;font-size:16px;margin-bottom:12px}
.money-show{font-size:64px;color:#222}
.money-show span{font-size:64px}

/* 数字键盘样式，仿微信支付键盘 */
.keyboard{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#d1d2d4;padding:6px}
.key-row{display:flex;gap:6px;margin-bottom:6px}
.key{flex:1;padding:18px 0;background:#fff;text-align:center;font-size:22px;border-radius:6px;user-select:none}
.key.empty{background:#b9bbbe;color:#666}
.key.del{background:#b9bbbe;color:#222}
.key.confirm{background:#07c160;color:white}

/* 支付成功弹窗 */
.result{display:none;padding:60px 20px;text-align:center}
.icon-ok{font-size:72px;color:#07c160;margin-bottom:16px}
.result h3{font-size:22px;color:#222}
.result p{margin-top:8px;color:#666;font-size:20px}
.tip-note{margin-top:30px;color:#999;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">模拟微信支付</div>

  <!-- 支付金额展示区域 -->
  <div class="money-area" id="payForm">
    <div class="money-label">支付金额</div>
    <div class="money-show">¥ <span id="amountText">0.00</span></div>
  </div>

  <!-- 支付成功页面 -->
  <div class="result" id="payResult">
    <div class="icon-ok">✓</div>
    <h3>支付成功</h3>
    <p>已支付 ¥<span id="successAmount"></span></p>
    <p class="tip-note">⚠️ 本页面仅课堂模拟练习，非真实转账</p>
  </div>

  <!-- 自定义数字键盘 -->
  <div class="keyboard" id="keyboard">
    <div class="key-row">
      <div class="key" onclick="inputNum('1')">1</div>
      <div class="key" onclick="inputNum('2')">2</div>
      <div class="key" onclick="inputNum('3')">3</div>
    </div>
    <div class="key-row">
      <div class="key" onclick="inputNum('4')">4</div>
      <div class="key" onclick="inputNum('5')">5</div>
      <div class="key" onclick="inputNum('6')">6</div>
    </div>
    <div class="key-row">
      <div class="key" onclick="inputNum('7')">7</div>
      <div class="key" onclick="inputNum('8')">8</div>
      <div class="key" onclick="inputNum('9')">9</div>
    </div>
    <div class="key-row">
      <div class="key empty"></div>
      <div class="key" onclick="inputNum('0')">0</div>
      <div class="key del" onclick="delNum()">⌫</div>
    </div>
    <div class="key-row">
      <div class="key" onclick="inputNum('.')">.</div>
      <div class="key confirm" onclick="submitPay()">确认支付</div>
    </div>
  </div>
</div>

<script>
let rawInput = "";
const amountText = document.getElementById("amountText");
const payForm = document.getElementById("payForm");
const payResult = document.getElementById("payResult");
const keyboard = document.getElementById("keyboard");
const successAmount = document.getElementById("successAmount");

// 更新显示金额，自动保留两位小数
function renderAmount(){
  if(rawInput === ""){
    amountText.innerText = "0.00";
    return;
  }
  // 防止多个小数点
  let parts = rawInput.split('.');
  if(parts.length>2) rawInput = parts[0] + "." + parts[1];
  // 最多保留2位小数
  if(parts[1] && parts[1].length>2){
    rawInput = parts[0] + "." + parts[1].slice(0,2);
  }
  amountText.innerText = rawInput;
}

function inputNum(char){
  rawInput += char;
  renderAmount();
}

function delNum(){
  rawInput = rawInput.slice(0,-1);
  renderAmount();
}

function submitPay(){
  let num = parseFloat(rawInput || "0");
  if(num <= 0 || isNaN(num)){
    alert("请输入有效的支付金额！");
    return;
  }
  successAmount.innerText = num.toFixed(2);
  payForm.style.display = "none";
  keyboard.style.display = "none";
  payResult.style.display = "block";
}
</script>
</body>
</html>
